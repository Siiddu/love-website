<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 1 Month ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="hearts"></div>
<div class="sakura"></div>

<div class="window">

<div class="titlebar">

<div class="title">
💖 LOVE.exe
</div>

<div class="buttons">
<span></span>
<span></span>
<span></span>
</div>

</div>

<div class="content">

<h1>Happy 1 Month 💗</h1>

<p class="subtitle">
ขอบคุณที่อยู่ด้วยกันนะ ☺️
</p>

<div class="cat">

<img src="assets/images/cat.gif" alt="cat">

</div>

<div class="letter">

<h2>💌 ถึงคนพิเศษ</h2>

<p id="typing"></p>

<button id="openLetter">
เปิดจดหมาย
</button>

</div>

<div class="gallery">

<img src="assets/images/photo1.jpg">

<img src="assets/images/photo2.jpg">

<img src="assets/images/photo3.jpg">

</div>

<div class="question">

<h2>ยังรักกันอยู่ไหม?</h2>

<div class="actions">

<button id="yesBtn">
YES ❤️
</button>

<button id="noBtn">
NO 😝
</button>

</div>

</div>

<div class="music">

<button id="musicBtn">
🎵 เปิดเพลง
</button>

<audio id="bgm" loop>

<source src="assets/music/love.mp3" type="audio/mpeg">

</audio>

</div>

</div>

</div>

<div id="popup">

<div class="popup-box">

<h2>🥹</h2>

<p>

ขอบคุณที่ตอบ YES

รักนะ ❤️

</p>

<button id="closePopup">

ปิด

</button>

</div>

</div>

<script src="script.js"></script>

</body>
  </html>
